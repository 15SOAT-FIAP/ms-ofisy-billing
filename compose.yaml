services:
  localstack:
    image: localstack/localstack:4.13.1
    container_name: ms-ofisy-billing-localstack
    environment:
      SERVICES: sns,sqs
      AWS_DEFAULT_REGION: us-east-1
    ports:
      - "4566:4566"
    volumes:
      - "./localstack/init/ready.d:/etc/localstack/init/ready.d"
    healthcheck:
      test: [ "CMD-SHELL", "curl -s localhost:4566/_localstack/init/ready | grep -q '\"completed\": true'" ]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16
    container_name: ms-ofisy-billing-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d ${POSTGRES_DB} -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: ms-ofisy-billing-app
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      JWT_SECRET: ${JWT_SECRET}
      CORE_BASE_URL: ${CORE_BASE_URL}
      CORE_SERVICE_TOKEN: ${CORE_SERVICE_TOKEN}
      STOCK_BASE_URL: ${STOCK_BASE_URL}
      STOCK_SERVICE_TOKEN: ${STOCK_SERVICE_TOKEN}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN}
    ports:
      - "8083:8080"

volumes:
  postgres_data:
