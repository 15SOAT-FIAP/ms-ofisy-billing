spring:
  application:
    name: ms-ofisy-billing
  flyway:
    enabled: true
    locations: classpath:db/migration
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5434/ms_ofisy_billing_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
  docker:
    compose:
      file: compose.db.yaml
  config:
    import: optional:file:.env[.properties]
  cloud:
    aws:
      region:
        static: us-east-1
ofisy:
  messaging:
    topics:
      billing: ofisy-billing-events.fifo
    outbox:
      publish-interval: 1s
      batch-size: 100
core:
  base-url: ${CORE_BASE_URL}
  service-token: ${CORE_SERVICE_TOKEN}
logging:
  level:
    org.flywaydb: DEBUG
