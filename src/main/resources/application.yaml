spring:
  application:
    name: ms-ofisy-billing
  flyway:
    enabled: true
    locations: classpath:db/migration
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://localhost:5435/ms_ofisy_billing_db
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
  docker:
    compose:
      file: compose.db.yaml
  config:
    import: optional:file:.env[.properties]
  cloud:
    aws:
      region:
        static: us-east-1
      sqs:
        queue-not-found-strategy: fail
ofisy:
  messaging:
    queues:
      billing: ofisy-billing.fifo
    topics:
      billing: ofisy-billing-events.fifo
    outbox:
      publish-interval: 1s
      batch-size: 100
jwt:
  secret: ${JWT_SECRET}
core:
  base-url: ${CORE_BASE_URL}
  service-token: ${CORE_SERVICE_TOKEN}
stock:
  base-url: ${STOCK_BASE_URL}
  service-token: ${STOCK_SERVICE_TOKEN}
security:
  public-paths:
    - /api/v1/quotes/*/approve
    - /api/v1/quotes/*/reprove
    - /actuator/health
management:
  endpoints:
    web:
      exposure:
        include: health
logging:
  level:
    org.flywaydb: DEBUG
